services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: examgenai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - examgenai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examgenai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/examgenai
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      FILE_UPLOAD_DIR: /tmp/uploads
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - examgenai_uploads:/tmp/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  examgenai_pg:
  examgenai_uploads:
