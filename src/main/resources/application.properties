spring.application.name=examgenai-backend

# Local par defaut ; sur Render : SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL (surchargeable via SPRING_DATASOURCE_*)
spring.datasource.url=jdbc:postgresql://localhost:5432/examgenai
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Uploads (sur Render : FILE_UPLOAD_DIR=/tmp/uploads)
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Port (Render injecte PORT)
server.port=${PORT:8080}

# CORS (liste separee par des virgules)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload max (PDF / Word)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Gemini models
gemini.api-url=https://generativelanguage.googleapis.com/v1beta
gemini.models=gemini-2.5-flash-lite,gemini-flash-lite-latest,gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-flash-latest,gemini-2.5-flash,gemini-3.5-flash,gemini-3.6-flash,gemini-3.7-flash,gemini-3.8-flash
