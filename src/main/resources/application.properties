spring.application.name=examgenai-backend

# Profil local : secrets dans application-local.properties
spring.profiles.active=local

# Configuration de la base PostgreSQL (commune)
spring.datasource.url=jdbc:postgresql://localhost:5432/examgenai
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration du fichier a uploder
file.upload-dir=./uploads

# Port de l'application
server.port=8080

# Taille max upload (PDF / Word)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB