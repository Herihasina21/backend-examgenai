spring.application.name=examgenai-backend

# Local par defaut ; sur Render : SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL (surchargeable via SPRING_DATASOURCE_*)
spring.datasource.url=jdbc:postgresql://localhost:5432/examgenai
spring.datasource.username=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Uploads (sur Render : /tmp/uploads via FILE_UPLOAD_DIR)
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Port (Render injecte PORT)
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload max (PDF / Word)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Gemini (cle via GEMINI_API_KEY ou application-local.properties)
gemini.api-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-3.6-flash